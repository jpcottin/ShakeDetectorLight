group: com.jpcottin
version: "1.0.0"
platform: android
type: application

kotlin:
  # Declared intent: keep the sample warning-clean. NOTE: verified to be a no-op
  # in Lightbuild 0.0.10-alpha01 — the key validates but reaches neither the
  # generated Gradle nor the compiler (a deliberate unused-variable warning still
  # builds). Kept so it takes effect once Lightbuild wires it up.
  # `kotlin.jvmTarget` is deliberately absent: the project-level
  # build.java.version already drives it, and the key fails schema validation
  # because the YAML parser coerces "17" to an integer before the string check.
  allWarningsAsErrors: true

dependencies:
  module:
    - //ui

android:
  namespace: com.jpcottin.shakedetectortest.app
  compileSdk:
    version:
      release:
        apiLevel: 37
  minSdk:
    version:
      release:
        apiLevel: 24
  targetSdk:
    version:
      release:
        apiLevel: 36
  applicationId: com.jpcottin.shakedetectortest
  versionCode: 1
  versionName: "1.0"
  packaging:
    # NOTE: adding this block flips the target that a bare `android build`
    # resolves to, from //app:buildDebug to //app:buildRelease. CI therefore
    # names the debug target explicitly instead of relying on the default.
    release:
      # R8 full-mode shrinking/obfuscation for the release APK and bundle.
      # `includeDefault` pulls in the default keep rules (Compose, AndroidX,
      # kotlinx.serialization) so the Navigation 3 back stack still serializes.
      optimization:
        enable: true
        keepRules:
          includeDefault: true
