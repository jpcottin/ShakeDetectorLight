group: com.jpcottin
version: "1.0.0"
platform: android
type: application

kotlin:
  # Declared intent: keep the sample warning-clean. NOTE: verified to be a no-op
  # in Lightbuild 0.0.20-alpha01 (as in 0.0.10-alpha01) — the key validates but
  # reaches neither the generated Gradle nor the compiler (a deliberate
  # unused-variable warning still builds). Kept so it takes effect once
  # Lightbuild wires it up.
  # `kotlin.jvmTarget` is deliberately absent: the project-level
  # build.java.version already drives it. (0.0.20-alpha01 fixed the validation
  # bug that rejected it — a quoted "17" is accepted now.)
  allWarningsAsErrors: true

android:
  namespace: com.jpcottin.shakedetectortest.app
  # Lightbuild 0.0.20-alpha01 moved `dependencies` (and `tests`) from the top
  # level of the module file into the `android` block.
  dependencies:
    module:
      - //ui
  compileSdk:
    version:
      release:
        apiLevel: 37
  minSdk:
    version:
      release:
        apiLevel: 24
  targetSdk:
    version:
      release:
        apiLevel: 36
  applicationId: com.jpcottin.shakedetectortest
  versionCode: 1
  versionName: "1.0"
  packaging:
    # NOTE: adding this block flips the target that a bare `android build`
    # resolves to, from //app:buildDebug to //app:buildRelease. CI therefore
    # names the debug target explicitly instead of relying on the default.
    release:
      # R8 full-mode shrinking/obfuscation for the release APK and bundle.
      # `includeDefault` pulls in the default keep rules (Compose, AndroidX,
      # kotlinx.serialization) so the Navigation 3 back stack still serializes.
      optimization:
        enable: true
        keepRules:
          includeDefault: true
