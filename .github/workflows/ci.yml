name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lightbuild support in the Android CLI is gated behind this variable:
  # it unlocks the `android build` command (and the lightbuild templates).
  ANDROID_CLI_BUILD: 'true'

jobs:
  build-and-unit-tests:
    name: Build + Unit Tests (Lightbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android CLI diagnostics
        run: |
          android --version
          android info

      - name: Build all modules
        run: android build

      - name: Run unit tests
        run: android build test

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            ui/build/outputs/test-results/
            ui/build/intermediates/unit_test_results/

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ui/build/outputs/apk/androidTest/debug/ui-debug-androidTest.apk

  instrumented-tests:
    name: Instrumented Tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build test APK with Lightbuild
        run: android build

      # The androidTest APK is self-instrumenting (library module), so only it
      # needs to be installed. `am instrument -w` exits 0 even when tests fail,
      # hence the explicit check for the "OK (N tests)" summary line.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r ui/build/outputs/apk/androidTest/debug/ui-debug-androidTest.apk
            adb shell am instrument -w com.jpcottin.shakedetectortest.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee instrument_output.txt
            grep -q "OK (" instrument_output.txt

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-output
          path: instrument_output.txt
          if-no-files-found: warn
